name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Ruff (lint and format, the version pinned in pyproject.toml)
        run: |
          uvx ruff@0.17.3 check
          uvx ruff@0.17.3 format --check

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the pinned environment (CPU PyTorch)
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -r pyproject.toml --extra dev --torch-backend cpu
      - name: Unit tests (data-dependent tests skip without `make data`)
        run: .venv/bin/pytest
